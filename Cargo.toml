[package]
name = "aster-fs"
version = "0.1.0"
rust-version = "1.75.0"
authors = [
  "AsterCommunity Contributors <contributors@astercosm.com>",
  "Dan Burkert <dan@danburkert.com>",
  "Al Liu <scygliu1@gmail.com>",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AsterCommunity/AsterFs"
documentation = "https://docs.rs/aster-fs"
description = "Auditable cross-platform file locking, allocation, and filesystem utilities for sync and async Rust."
keywords = ["file", "filesystem", "lock", "preallocate", "async"]
categories = ["filesystem", "external-ffi-bindings", "asynchronous"]
edition = "2021"

[features]
default = ["sync"]
sync = []
async-std = ["dep:async-std"]
tokio = ["dep:tokio"]
smol = ["dep:smol"]
fs-err2 = ["dep:fs-err2", "fs-err2/io_safety"]
fs-err2-tokio = ["fs-err2", "fs-err2/tokio", "dep:tokio"]
fs-err3 = ["dep:fs-err3"]
fs-err3-tokio = ["fs-err3", "fs-err3/tokio", "dep:tokio"]


[target.'cfg(not(windows))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"]

[dependencies]
async-std = { version = "1", optional = true }
fs-err2 = { package = "fs-err", version = "2", optional = true }
fs-err3 = { package = "fs-err", version = "3", optional = true }
smol = { version = "2", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["fs", "rt"] }

[dev-dependencies]
async-std = { version = "1", features = ["attributes"] }
fs-err2 = { package = "fs-err", version = "2", features = ["io_safety", "tokio"] }
fs-err3 = { package = "fs-err", version = "3", features = ["tokio"] }
smol-potat = "1.1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]

[[test]]
name = "apple_preallocation"
path = "tests/apple_preallocation.rs"
required-features = ["sync"]

[[test]]
name = "apple_async_preallocation"
path = "tests/apple_async_preallocation.rs"
required-features = ["tokio"]
